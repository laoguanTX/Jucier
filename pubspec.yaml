name: jucier
description: "A focused, native-feeling archive utility for macOS."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  desktop_drop: ^0.6.1
  file_selector: ^1.0.4
  forui: 0.26.0
  material_ui: ^1.0.0
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sevenzip/
    - assets/sevenzip/licenses/
